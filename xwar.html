<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>XWAR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    height:100%;
    background:#0d0b14;
    overflow:hidden;
    font-family:"Courier New",monospace;
    color:#fff;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 30%, #241a3a 0%, #0d0b14 70%);
  }
  canvas {
    background:#000;
    image-rendering:auto;   /* smooth upscale — softer, less pixelated look */
    box-shadow:0 0 0 4px #000, 0 0 0 8px #2a2140, 0 20px 60px rgba(0,0,0,.7);
    max-width:100vw; max-height:100vh;
  }
  #hint {
    position:fixed; bottom:8px; left:0; right:0; text-align:center;
    font-size:12px; color:#5a4f78; letter-spacing:1px;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="900" height="520"></canvas></div>
<div id="hint">MOVE ← →   JUMP ↑   BLOCK ↓   ATTACK: SPACE   SWAP WEAPON: C   MENU: mouse or ↑↓ + ENTER</div>
<script>
(function(){
"use strict";

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND = H - 70;
const MAX_HP = 140;   // higher health = longer rounds, more back-and-forth

/* ---------- responsive scaling ---------- */
function fit(){
  const pad = 24;
  const s = Math.min((window.innerWidth-pad)/W, (window.innerHeight-pad)/H);
  cv.style.width = (W*s)+'px';
  cv.style.height = (H*s)+'px';
}
window.addEventListener('resize', fit); fit();

/* ---------- tiny sound engine (WebAudio) ---------- */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, vol){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  g.gain.value = vol||0.06;
  o.connect(g); g.connect(a.destination);
  const t = a.currentTime;
  o.start(t);
  g.gain.setValueAtTime(g.gain.value, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.stop(t+dur+0.02);
}
const SFX = {
  swing(){ beep(220,0.09,'sawtooth',0.05); },
  hit(){ beep(90,0.14,'square',0.10); beep(160,0.08,'square',0.06); },
  block(){ beep(320,0.07,'square',0.05); },
  jump(){ beep(500,0.10,'sine',0.05); },
  select(){ beep(660,0.06,'square',0.05); },
  win(){ beep(523,0.12,'square',0.07); setTimeout(()=>beep(784,0.18,'square',0.07),120); },
  lose(){ beep(200,0.2,'sawtooth',0.07); setTimeout(()=>beep(120,0.3,'sawtooth',0.07),150); }
};

/* ---------- input ---------- */
const keys = {};
const pressed = {};
window.addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  ac();
});
window.addEventListener('keyup', e=>{ keys[e.code] = false; });
let mouse = {x:0,y:0,click:false};
cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX-r.left) * (W/r.width);
  mouse.y = (e.clientY-r.top) * (H/r.height);
});
cv.addEventListener('mousedown', e=>{ mouse.click = true; ac(); });
let wheel = 0;   // accumulated mouse-wheel delta, consumed each frame
window.addEventListener('wheel', e=>{ wheel += e.deltaY; }, {passive:true});

/* ---------- weapons ----------
   base:true  = choosable from the start.
   base:false = LOCKED; earned by winning rounds (see UNLOCK_ORDER). */
const WEAPONS = [
  { name:'FISTS',  short:'FISTS',  base:true, kind:'melee', style:null,     dmgType:'blunt', dmg:6,  reach:52, cd:26, active:6, kb:6,  color:null,     desc:'Fast & light. Spam it!' },
  { name:'SWORD',  short:'SWORD',  base:true, kind:'melee', style:'sword',  dmgType:'blade', dmg:11, reach:78, cd:40, active:7, kb:9,  color:'#cfd8e3', desc:'Long reach, solid hits.' },
  { name:'HAMMER', short:'HAMMER', base:true, kind:'melee', style:'hammer', dmgType:'blunt', dmg:18, reach:66, cd:58, active:9, kb:16, color:'#8a5a2b', desc:'Slow but crushing.' },
  { name:'DAGGER', short:'DAGGER', base:true, kind:'melee', style:'dagger', dmgType:'pierce', dmg:8,  reach:48, cd:18, active:5, kb:5,  color:'#e0e0e0', desc:'Blazing fast jabs.' },
  // ----- unlockable -----
  { name:'KUNAI',        short:'KUNAI',      base:false, kind:'ranged', style:'kunai', dmgType:'pierce', dmg:8,  reach:130, cd:24, active:5, kb:6,  color:'#cfd8e3', proj:'#dfe8f0', desc:'Thrown blades — hit from range!' },
  { name:'KNIFE',        short:'KNIFE',      base:false, kind:'melee',  style:'knife', dmgType:'blade', dmg:9,  reach:52,  cd:16, active:4, kb:5,  color:'#f0f0f0', desc:'Lightning-fast close jabs.' },
  { name:'ELEMENT GUN',  short:'ELEM GUN',   base:false, kind:'ranged', style:'gun',   dmgType:'energy', dmg:10, reach:150, cd:32, active:6, kb:7,  color:'#8a8f99', glow:'#5ad0ff', proj:'#5ad0ff', desc:'Fires energy bolts across the arena.' },
  { name:'GRENADE',      short:'GRENADE',    base:false, kind:'throw',  style:'throw', dmgType:'explosive', dmg:16, reach:150, cd:72, active:6, kb:16, color:'#3a5a2a', glow:'#ffaa00', proj:'#4a6a2a', desc:'Lobbed bomb with a big blast!' },
  { name:'LIGHT SABER',       short:'SABER',       base:false, kind:'melee', style:'saber', dmgType:'energy', dmg:13, reach:88, cd:32, active:8, kb:10, color:'#d6faff', glow:'#00e5ff', desc:'Glowing blade, great reach.' },
  { name:'FIRE LIGHT SABER',  short:'FIRE SABER',  base:false, kind:'melee', style:'saber', dmgType:'energy', dmg:15, reach:88, cd:32, active:8, kb:11, color:'#ffe0a0', glow:'#ff6a00', desc:'Burning blade, extra power.' },
  { name:'LAVA LIGHT SABER',  short:'LAVA SABER',  base:false, kind:'melee', style:'saber', dmgType:'energy', dmg:17, reach:86, cd:36, active:9, kb:13, color:'#ffc08a', glow:'#ff2a00', desc:'Molten blade, huge damage.' },
  { name:'WATER LIGHT SABER', short:'WATER SABER', base:false, kind:'melee', style:'saber', dmgType:'energy', dmg:13, reach:92, cd:28, active:8, kb:9,  color:'#cdecff', glow:'#2a9fff', desc:'Cool blade, fast & long.' },
  { name:'VINE WHIP',    short:'VINE WHIP',  base:false, kind:'melee', style:'whip', dmgType:'blade', dmg:12, reach:106, cd:40, active:9, kb:9, color:'#4a9a3a', desc:'Spiked whip with crazy reach.' }
];
// order weapons are earned in, one per round won
const UNLOCK_ORDER = ['KUNAI','KNIFE','ELEMENT GUN','GRENADE','LIGHT SABER',
                      'FIRE LIGHT SABER','LAVA LIGHT SABER','WATER LIGHT SABER','VINE WHIP'];
let unlocked = new Set(WEAPONS.filter(w=>w.base).map(w=>w.name));
function weaponUnlocked(w){ return w.base || unlocked.has(w.name); }
function unlockNext(){
  for(const nm of UNLOCK_ORDER){ if(!unlocked.has(nm)){ unlocked.add(nm); saveState(); return nm; } }
  return null; // everything already unlocked
}

/* ---------- potions (earned by winning matches) ----------
   Cards stay LOCKED until you earn one of that type. */
const HP_BASE   = MAX_HP;   // base max health (140)
const ENCH_STEP = 0.12;     // +12% weapon damage per enchant level
const ENCH_CAP  = 3;        // max enchant levels per weapon
const HP_STEP   = 15;       // +15 max HP per health potion
const HP_CAP    = 60;       // up to +60 (max 200)
const POTIONS = [
  { key:'enchant', name:'ENCHANTING POTION', icon:'#b46bff', glow:'#d9a6ff',
    desc:'Upgrade your EQUIPPED weapon: +12% damage each (max +3).' },
  { key:'health',  name:'HEALTH POTION',     icon:'#ff4c6b', glow:'#ff9ab0',
    desc:'Permanently raise your MAX HEALTH by 15 (up to +60).' }
];
let potions = { enchant:0, health:0 };   // how many you own
let weaponLevels = {};                    // weapon name -> enchant level
let bonusHP = 0;                          // extra max HP from health potions
let potionsUnlocked = new Set();          // which potion cards are revealed
function enchantLevel(w){ return w ? (weaponLevels[w.name]||0) : 0; }
function enchantMult(w){ return 1 + ENCH_STEP*enchantLevel(w); }
function playerMaxHP(){ return HP_BASE + bonusHP; }
function potionDef(key){ return POTIONS.find(p=>p.key===key); }
// win a match -> earn one random potion; reveal its card the first time
function awardPotion(){
  const key = Math.random()<0.5 ? 'enchant' : 'health';
  potions[key]++;
  potionsUnlocked.add(key);
  saveState();
  return potionDef(key);
}

/* ---------- armor (earned by winning matches, weakest first) ----------
   Layered defence: owned armors stack weakest->strongest; the weakest is
   the active outer layer and absorbs hits until its durability breaks,
   then the next layer takes over. `resist[type]` = fraction of damage that
   still gets THROUGH this armor for that weapon damage type (lower = better). */
const ARMORS = [
  { key:'wood',    name:'WOOD',       short:'WOOD',    body:'#8a5a2b', trim:'#6b4420', style:'wood',    dura:40,
    resist:{ blunt:0.85, blade:0.75, pierce:0.80, energy:0.95, explosive:0.90 } },
  { key:'leather', name:'LEATHER',    short:'LEATHER', body:'#9a6b3a', trim:'#6f4a24', style:'leather', dura:55,
    resist:{ blunt:0.80, blade:0.65, pierce:0.75, energy:0.70, explosive:0.85 } },
  { key:'chain',   name:'CHAIN MAIL', short:'CHAIN',   body:'#9aa3b0', trim:'#6b7280', style:'chain',   dura:75,
    resist:{ blunt:0.75, blade:0.45, pierce:0.70, energy:0.65, explosive:0.80 } },
  { key:'gold',    name:'GOLD',       short:'GOLD',    body:'#ffd24a', trim:'#c79a1e', style:'gold',    dura:95,
    resist:{ blunt:0.55, blade:0.50, pierce:0.55, energy:0.45, explosive:0.70 } },
  { key:'iron',    name:'IRON',       short:'IRON',    body:'#c9d2dc', trim:'#8a94a0', style:'iron',    dura:130,
    resist:{ blunt:0.45, blade:0.40, pierce:0.45, energy:0.50, explosive:0.60 } }
];
// award order = index order (wood first ... iron last)
const ARMOR_ORDER = ARMORS.map(a=>a.key);
let armorsUnlocked = new Set();          // which armor keys the player owns
function armorDef(key){ return ARMORS.find(a=>a.key===key); }
function ownedArmors(){ return ARMORS.filter(a=>armorsUnlocked.has(a.key)); } // weakest->strongest
// the damage type this armor resists best / worst (lowest / highest "through" value)
function armorBestWorst(a){
  let best, worst, bv=2, wv=-1;
  for(const t in a.resist){ const v=a.resist[t];
    if(v<bv){ bv=v; best=t; } if(v>wv){ wv=v; worst=t; } }
  return { best, worst };
}
// win a match -> earn the next armor in order; returns its def (or null if all owned)
function awardArmor(){
  for(const key of ARMOR_ORDER){
    if(!armorsUnlocked.has(key)){ armorsUnlocked.add(key); saveState(); return armorDef(key); }
  }
  return null;
}

/* ---------- saved progress (browser localStorage) ---------- */
const SAVE_KEY = 'xwar_save_v1';
function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
    unlocked:[...unlocked], weapon:playerWeapon, difficulty,
    potions, weaponLevels, bonusHP, potionsUnlocked:[...potionsUnlocked],
    armors:[...armorsUnlocked]
  })); }catch(e){}
}
// wipe ALL saved progress back to a brand-new game
function resetGame(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  unlocked = new Set(WEAPONS.filter(w=>w.base).map(w=>w.name));
  potions = { enchant:0, health:0 };
  weaponLevels = {};
  bonusHP = 0;
  potionsUnlocked = new Set();
  armorsUnlocked = new Set();
  playerWeapon = 0; weaponIndex = 0;
  difficulty = 0; diffIndex = 0;
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!s) return;
    if(Array.isArray(s.unlocked)) s.unlocked.forEach(n=>unlocked.add(n));
    if(typeof s.difficulty==='number' && DIFFICULTIES[s.difficulty]) difficulty = s.difficulty;
    if(typeof s.weapon==='number' && WEAPONS[s.weapon] && weaponUnlocked(WEAPONS[s.weapon])) playerWeapon = s.weapon;
    if(s.potions){ potions.enchant = s.potions.enchant|0; potions.health = s.potions.health|0; }
    if(s.weaponLevels && typeof s.weaponLevels==='object') weaponLevels = s.weaponLevels;
    if(typeof s.bonusHP==='number') bonusHP = Math.max(0, Math.min(HP_CAP, s.bonusHP));
    if(Array.isArray(s.potionsUnlocked)) s.potionsUnlocked.forEach(k=>potionsUnlocked.add(k));
    if(Array.isArray(s.armors)) s.armors.forEach(k=>{ if(armorDef(k)) armorsUnlocked.add(k); });
  }catch(e){}
}

/* ---------- difficulty levels ---------- */
const DIFFICULTIES = [
  { name:'BEGINNER', think:[44,56], aggro:0.28, block:0.02, react:0.01, move:1.5, dmg:0.5,
    color:'#7fe07f', desc:'Slow, gentle CPU. Great for learning.' },
  { name:'NORMAL',   think:[24,36], aggro:0.45, block:0.06, react:0.05, move:2.1, dmg:0.8,
    color:'#ffd23f', desc:'A fair, balanced fight.' },
  { name:'ADVANCED', think:[15,23], aggro:0.6,  block:0.12, react:0.13, move:2.6, dmg:1.1,
    color:'#ff8a3f', desc:'Fast, aggressive, guards a lot.' },
  { name:'INSANE',   think:[9,15],  aggro:0.74, block:0.20, react:0.24, move:3.1, dmg:1.4,
    color:'#ff4c4c', desc:'Relentless. You have been warned.' }
];
let difficulty = 0; // index; default Beginner

/* ---------- fighter ---------- */
function makeFighter(x, dir, isPlayer){
  const wpn = isPlayer ? WEAPONS[playerWeapon] : WEAPONS[0];
  const maxHp = isPlayer ? playerMaxHP() : HP_BASE;
  return {
    x, y:GROUND, vx:0, vy:0, dir, isPlayer,
    hp:maxHp, maxHp, onGround:true,
    attacking:false, atkTimer:0, atkCd:0, hasHit:false,
    blocking:false, hitstun:0, flash:0,
    weapon: wpn,
    walk:0, wins:0, bob:Math.random()*6.28, dmgMult:1,
    enchant: isPlayer ? enchantMult(wpn) : 1,  // player weapon damage bonus
    armorStack: isPlayer ? ownedArmors().map(a=>({def:a, dura:a.dura, max:a.dura})) : [],
    armorIdx: 0, armorBreakFx: 0,              // layered armor: active layer + shatter flash
    ai:{ think:0, action:'idle' }
  };
}
// rebuild the layered armor stack to full (called each round)
function refillArmor(f){
  f.armorStack = f.isPlayer ? ownedArmors().map(a=>({def:a, dura:a.dura, max:a.dura})) : [];
  f.armorIdx = 0; f.armorBreakFx = 0;
}
// active (first un-broken) armor layer, or null
function activeArmor(f){
  if(!f.armorStack) return null;
  while(f.armorIdx < f.armorStack.length && f.armorStack[f.armorIdx].dura<=0) f.armorIdx++;
  return f.armorIdx < f.armorStack.length ? f.armorStack[f.armorIdx] : null;
}
// reduce an incoming hit by the active armor layer; chip durability; cascade on break
function applyArmor(f, incoming, type){
  const layer = activeArmor(f);
  if(!layer) return incoming;                       // no armor / all broken
  const through = (layer.def.resist[type] != null) ? layer.def.resist[type] : 0.8;
  const dealt = incoming * through;
  layer.dura -= incoming;                           // the full hit stresses the armor
  if(layer.dura <= 0){
    layer.dura = 0;
    f.armorBreakFx = 20;
    spawnParticles(f.x, f.y-92, layer.def.body, 16);
    spawnParticles(f.x, f.y-92, '#ffffff', 6);
    SFX.block();                                    // crack
    f.armorIdx++;                                   // next layer takes over
  }
  return dealt;
}

/* ---------- game state ---------- */
let scene = 'home';        // home | weapons | armor | potions | difficulty | help | fight | roundover | matchover | reset | quit
let playerWeapon = 0;
let menuIndex = 0;
let weaponIndex = 0;
let player, enemy;
let particles = [];
let projectiles = [];
let unlockNotice = null;   // name of weapon just unlocked, shown between rounds
let potionNotice = null;   // potion earned this match, shown on match-over
let armorNotice = null;    // armor earned this match, shown on match-over
let shake = 0;
let round = 1;
let roundBanner = 0, bannerText = '';
let countdownStart = 0, lastCount = 0;
let matchResult = '';
let demoTimer = 0;
let diffIndex = 0;
let potionIndex = 0;
let armorIndex = 0;
let potionMsg = '';        // transient feedback on the potions screen
let helpScroll = 0;        // vertical scroll offset on the HELP screen
let resetSel = 0;          // reset confirm: 0 = NO (cancel), 1 = YES (wipe)
const MENU = ['PLAY','WEAPONS','ARMOR','POTIONS','DIFFICULTY','HELP','RESET','QUIT'];

loadState();   // restore unlocked weapons + last weapon/difficulty

/* demo fighters for the home screen */
let demoA = makeFighter(150, 1, true);   // left of the menu, faces inward
let demoB = makeFighter(750, -1, false); // right of the menu, faces inward
demoA.hp = demoB.hp = MAX_HP;

function startMatch(){
  player = makeFighter(260, 1, true);
  enemy  = makeFighter(640, -1, false);
  player.weapon = WEAPONS[playerWeapon];
  player.enchant = enchantMult(player.weapon);
  // Beginner = fair mirror match (CPU uses your weapon); harder levels use a base weapon.
  enemy.weapon = (difficulty===0) ? WEAPONS[playerWeapon] : pickEnemyWeapon();
  enemy.dmgMult = DIFFICULTIES[difficulty].dmg;
  round = 1; player.wins = 0; enemy.wins = 0;
  particles = []; projectiles = []; unlockNotice = null; potionNotice = null; armorNotice = null;
  scene = 'fight';
  showBanner('ROUND 1 — FIGHT!');
}
function pickEnemyWeapon(){
  const base = WEAPONS.filter(w=>w.base);
  return base[Math.floor(Math.random()*base.length)];
}
function nextRound(){
  player.hp = player.maxHp; enemy.hp = enemy.maxHp;
  player.x = 260; enemy.x = 640;
  player.dir = 1; enemy.dir = -1;
  player.vx=player.vy=0; enemy.vx=enemy.vy=0;
  player.attacking=enemy.attacking=false;
  player.hitstun=enemy.hitstun=0;
  refillArmor(player);                 // armor restored to full each round
  particles = []; projectiles = [];
  scene = 'fight';
  showBanner('ROUND '+round+' — FIGHT!');
}
function showBanner(t){ bannerText = t; roundBanner = 110; }

/* ---------- combat helpers ---------- */
function attackBox(f){
  const w = f.weapon;
  const x = f.dir>0 ? f.x+18 : f.x-18-w.reach;
  return { x, y:f.y-118, w:w.reach, h:70 };
}
function bodyBox(f){
  return { x:f.x-26, y:f.y-132, w:52, h:132 };
}
function overlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*8,
      vy:-Math.random()*7-1,
      life:1, color
    });
  }
}

function tryAttack(f){
  if(f.attacking || f.atkCd>0 || f.hitstun>0) return;
  f.attacking = true;
  f.atkTimer = f.weapon.cd;
  f.hasHit = false;
  SFX.swing();
}

function updateFighter(f, foe){
  // face the foe (unless mid-attack)
  if(!f.attacking && f.hitstun<=0){
    f.dir = (foe.x < f.x) ? -1 : 1;
  }
  // gravity
  f.vy += 0.9;
  f.y += f.vy;
  if(f.y >= GROUND){ f.y = GROUND; f.vy = 0; f.onGround = true; }
  else f.onGround = false;

  f.x += f.vx;
  f.vx *= 0.8;
  // bounds
  f.x = Math.max(40, Math.min(W-40, f.x));

  if(f.hitstun>0) f.hitstun--;
  if(f.atkCd>0) f.atkCd--;
  if(f.flash>0) f.flash--;
  if(f.armorBreakFx>0) f.armorBreakFx--;

  // attack lifecycle
  if(f.attacking){
    f.atkTimer--;
    const w = f.weapon;
    const activeStart = w.cd - 6;
    const activeEnd = activeStart - w.active;
    if(f.atkTimer<=activeStart && f.atkTimer>activeEnd && !f.hasHit && (w.kind==='ranged'||w.kind==='throw')){
      // ranged / thrown weapons launch a projectile (once per swing)
      f.hasHit = true;
      spawnProjectile(f);
    }
    if(f.atkTimer<=activeStart && f.atkTimer>activeEnd && !f.hasHit && w.kind==='melee'){
      // melee hit check
      if(overlap(attackBox(f), bodyBox(foe)) && foe.hitstun<=0){
        f.hasHit = true;
        if(foe.blocking && foe.onGround){
          // fully blocked — a guarded hit deals NO damage
          foe.vx = f.dir*4;
          foe.flash = 4;
          shake = Math.max(shake,4);
          spawnParticles(foe.x + foe.dir* -20, foe.y-90, '#8fd0ff', 8);
          SFX.block();
        } else {
          let dmg = w.dmg * (f.dmgMult||1) * (f.enchant||1);
          if(foe.isPlayer) dmg = applyArmor(foe, dmg, w.dmgType);   // armor soaks player hits
          foe.hp -= dmg;
          foe.hitstun = 16;
          foe.flash = 6;
          // knock the struck figure back so the impact is obvious
          foe.vx = f.dir * w.kb * 1.7;
          foe.vy = -4;
          foe.x += f.dir * 10;      // instant recoil the moment the hit lands
          f.vx += f.dir * 3;        // attacker leans into the blow
          shake = Math.max(shake, 6 + w.kb*0.3);
          spawnParticles(foe.x, foe.y-90, '#3aa8ff', 14);   // water splash
          spawnParticles(foe.x, foe.y-90, '#bfe9ff', 6);    // light spray
          SFX.hit();
          if(foe.hp<0) foe.hp = 0;
        }
      }
    }
    if(f.atkTimer<=0){
      f.attacking = false;
      f.atkCd = 6;
    }
  }

  // walk anim
  if(Math.abs(f.vx)>0.6 && f.onGround) f.walk += 0.3; else f.walk *= 0.8;
  f.bob += 0.05;
}

function swapRandomWeapon(f){
  // pick a random UNLOCKED weapon different from the current one
  const pool = WEAPONS.filter(w=>weaponUnlocked(w) && w!==f.weapon);
  if(pool.length===0) return;
  const nw = pool[Math.floor(Math.random()*pool.length)];
  f.weapon = nw;
  if(f.isPlayer){ playerWeapon = WEAPONS.indexOf(nw); f.enchant = enchantMult(nw); }
  // cancel any in-progress swing so the new weapon starts clean
  f.attacking = false; f.atkCd = 0; f.hasHit = false;
  spawnParticles(f.x, f.y-90, '#ffd23f', 10);
  SFX.select();
}

function controlPlayer(f){
  if(pressed['KeyC']) swapRandomWeapon(f);
  if(f.hitstun>0) return;
  f.blocking = keys['ArrowDown'] && f.onGround;
  const spd = f.blocking ? 0 : 3.2;
  if(keys['ArrowLeft']) f.vx = -spd;
  if(keys['ArrowRight']) f.vx = spd;
  if(pressed['ArrowUp'] && f.onGround){ f.vy = -15; f.onGround=false; SFX.jump(); }
  if(pressed['Space']) tryAttack(f);
}

function controlAI(f, foe){
  if(f.hitstun>0){ f.blocking=false; return; }
  const D = DIFFICULTIES[difficulty];
  const dist = Math.abs(foe.x - f.x);
  const reach = f.weapon.reach + 26;
  const a = f.ai;
  a.think--;
  if(a.think<=0){
    a.think = D.think[0] + Math.random()*(D.think[1]-D.think[0]);
    const r = Math.random();
    if(dist > reach){
      a.action = 'approach';
    } else {
      // in range
      if(r < D.aggro) a.action = 'attack';
      else if(r < D.aggro+0.15) a.action = 'block';
      else if(r < D.aggro+0.28) a.action = 'retreat';
      else a.action = 'jump';
    }
  }
  f.blocking = false;
  const dir = (foe.x < f.x) ? -1 : 1;
  switch(a.action){
    case 'approach': f.vx = dir*D.move; break;
    case 'retreat':  f.vx = -dir*(D.move*0.85); break;
    case 'attack':
      if(dist <= reach){ tryAttack(f); a.action='idle'; }
      else a.action='approach';
      break;
    case 'block':    f.blocking = f.onGround; break;
    case 'jump':
      if(f.onGround){ f.vy=-14; f.vx=dir*2; }
      a.action='approach';
      break;
  }
  // reactively block incoming attacks (better AIs react far more)
  if(foe.attacking && dist < reach+20 && Math.random()<D.react) f.blocking = f.onGround;
}

/* ---------- BLOCKY CHARACTER ART ---------- */
function drawFighter(f, palette, t){
  const px  = (bx,by,bw,bh,c)=>{ ctx.fillStyle=c; ctx.fillRect(Math.round(bx),Math.round(by),bw,bh); };
  const pxr = (bx,by,bw,bh,c,r)=>{ fillRR(bx,by,bw,bh,r||6,c); };   // rounded, softer pieces
  const P = palette;
  const cx = f.x;             // center x (feet)
  const base = f.y;          // feet baseline
  const idle = Math.sin(f.bob)*2 * (f.onGround?1:0);
  const legSwing = Math.sin(f.walk)*8;

  ctx.save();

  // flash tint on hit
  const flashing = f.flash>0 && (f.flash%2===0);

  // ---- legs ----
  const legY = base - 42;
  const l1 = f.onGround ? legSwing : 6;
  const l2 = f.onGround ? -legSwing : -6;
  pxr(cx-18, legY, 14, 42+ (l1<0?l1:0), P.pants, 6);
  pxr(cx+4,  legY, 14, 42+ (l2<0?l2:0), P.pants, 6);
  // feet
  pxr(cx-20, base-6, 16, 8, P.shoe, 4);
  pxr(cx+4,  base-6, 16, 8, P.shoe, 4);

  // ---- torso ----
  const torsoY = base - 100 + idle;
  pxr(cx-24, torsoY, 48, 58, P.shirt, 12);
  // belt
  pxr(cx-24, torsoY+50, 48, 8, P.belt, 4);
  // chest emblem
  pxr(cx-6, torsoY+14, 12, 14, P.emblem, 3);

  // ---- active armor worn over the torso (player only) ----
  let wornArmor = null;
  if(f.armorStack){ for(let i=f.armorIdx;i<f.armorStack.length;i++){ if(f.armorStack[i].dura>0){ wornArmor=f.armorStack[i].def; break; } } }
  if(wornArmor){
    const bcol=wornArmor.body, tcol=wornArmor.trim, ty=torsoY;
    fillRR(cx-25, ty-1, 50, 50, 13, tcol);                 // trim backing
    fillRR(cx-24, ty-1, 15, 13, 5, tcol);                  // left pauldron
    fillRR(cx+9,  ty-1, 15, 13, 5, tcol);                  // right pauldron
    fillRR(cx-21, ty+2, 42, 44, 11, bcol);                 // chest plate
    // material texture, clipped to the plate so wood/leather/etc. read distinctly
    const P0x=cx-21, P0y=ty+2, PW=42, PH=44, dk=shade(bcol,-0.32), lt=shade(bcol,0.28);
    ctx.save(); rrpath(P0x,P0y,PW,PH,11); ctx.clip();
    ctx.fillStyle=shade(bcol,0.22); ctx.fillRect(Math.round(cx-16),Math.round(ty+7),5,30);  // highlight
    switch(wornArmor.style){
      case 'wood':                                          // vertical planks
        ctx.strokeStyle=dk; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(cx-7,P0y); ctx.lineTo(cx-7,P0y+PH);
                         ctx.moveTo(cx+7,P0y); ctx.lineTo(cx+7,P0y+PH); ctx.stroke();
        break;
      case 'leather':                                       // stitched border + seam
        ctx.strokeStyle=lt; ctx.lineWidth=1.6; ctx.setLineDash([4,3]);
        rrpath(P0x+4,P0y+4,PW-8,PH-8,8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx,P0y+4); ctx.lineTo(cx,P0y+PH-4); ctx.stroke();
        ctx.setLineDash([]);
        break;
      case 'chain':                                         // ring mesh
        ctx.strokeStyle=dk; ctx.lineWidth=1.5;
        for(let yy=P0y+7; yy<P0y+PH; yy+=8) for(let xx=P0x+7; xx<P0x+PW; xx+=8){ ctx.beginPath(); ctx.arc(xx,yy,3,0,6.28); ctx.stroke(); }
        break;
      case 'gold': {                                        // shine + ruby gem
        ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(P0x+4,P0y+2,6,PH-6);
        const gx=cx, gy=P0y+PH*0.5, gr=6; ctx.fillStyle='#e63a5e';
        ctx.beginPath(); ctx.moveTo(gx,gy-gr); ctx.lineTo(gx+gr,gy); ctx.lineTo(gx,gy+gr); ctx.lineTo(gx-gr,gy); ctx.closePath(); ctx.fill();
        break;
      }
      case 'iron':                                          // seam + rivets
        ctx.strokeStyle=dk; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(cx,P0y+3); ctx.lineTo(cx,P0y+PH-3); ctx.stroke();
        ctx.fillStyle=lt;
        [[P0x+7,P0y+7],[P0x+PW-7,P0y+7],[P0x+8,P0y+PH-8],[P0x+PW-8,P0y+PH-8]].forEach(([xx,yy])=>{ ctx.beginPath(); ctx.arc(xx,yy,2,0,6.28); ctx.fill(); });
        break;
    }
    ctx.restore();
  }

  // ---- head ----
  const headY = torsoY - 40;
  pxr(cx-20, headY, 40, 40, P.skin, 13);
  // hair
  pxr(cx-20, headY, 40, 14, P.hair, 8);
  pxr(cx-20, headY+2, 8, 24, P.hair, 4);
  pxr(cx+12, headY+2, 8, 24, P.hair, 4);
  // eyes (face forward-ish based on dir)
  const ex = f.dir>0 ? 4 : -14;
  px(cx+ex, headY+18, 6, 8, '#fff');
  px(cx+ex+ (f.dir>0?2:2), headY+20, 4, 5, '#111');
  px(cx+ex+ (f.dir>0?14:0)-0, headY+18, 6, 8, '#fff');
  // mouth
  px(cx-8, headY+32, 16, 3, '#5a2b2b');

  // ---- arms & weapon ----
  const armY = torsoY + 6;
  const w = f.weapon;
  // back arm
  px(cx + (f.dir>0? -30 : 24), armY, 12, 40, P.skin);

  if(f.blocking){
    // both arms up guarding face
    px(cx-30, headY+8, 14, 34, P.skin);
    px(cx+16, headY+8, 14, 34, P.skin);
    px(cx-18, headY+2, 36, 12, P.shirt);
  } else if(f.attacking){
    // extended front arm + weapon during active-ish frames
    const w2 = f.weapon;
    const dir = f.dir;
    const ext = (f.atkTimer < w2.cd-3 && f.atkTimer > w2.cd-w2.active-8) ? 1 : 0.4;
    // ranged weapons don't lunge the arm out by their (long) range
    const reachForArm = (w2.kind==='ranged'||w2.kind==='throw') ? 40 : w2.reach;
    const armLen = 22 + reachForArm*0.5*ext;
    const ax = dir>0 ? cx+16 : cx-16-armLen;
    px(ax, armY+4, armLen, 12, P.skin);
    const tipX = dir>0 ? ax+armLen : ax;   // far end of the arm
    const st = w2.style;
    if(st==='sword' || st==='knife'){
      const bl = st==='knife'?30:40;
      px(tipX-4, armY-16, 8, bl, w2.color);
      px(tipX-8, armY+bl-18, 16, 7, '#6b4a2a');           // guard
    } else if(st==='hammer'){
      px(tipX-13, armY-14, 26, 26, w2.color);
      px(tipX-5, armY+10, 10, 22, '#4a3018');
    } else if(st==='dagger'){
      px(dir>0?tipX:tipX-18, armY-2, 18, 8, w2.color);
      px(dir>0?tipX-6:tipX+16, armY-1, 8, 6, '#6b4a2a');
    } else if(st==='kunai'){
      px(dir>0?tipX:tipX-20, armY-4, 20, 10, w2.color);
      px(dir>0?tipX+18:tipX-26, armY-1, 8, 4, w2.color);  // point
      px(dir>0?tipX-8:tipX+14, armY-3, 6, 8, '#6b4a2a');  // grip ring
    } else if(st==='gun'){
      px(dir>0?tipX-6:tipX-16, armY-6, 22, 14, w2.color); // body
      px(dir>0?tipX+14:tipX-22, armY-2, 8, 6, w2.glow||'#5ad0ff'); // muzzle
      px(dir>0?tipX-2:tipX+2, armY+8, 8, 10, '#333');     // grip
    } else if(st==='throw'){
      ctx.save(); if(w2.glow){ ctx.shadowColor=w2.glow; ctx.shadowBlur=8; }
      px(tipX-6, armY-6, 12, 12, w2.color);
      ctx.restore();
      px(tipX-2, armY-10, 4, 5, '#111');                  // fuse
    } else if(st==='whip'){
      const segN=6, seg=armLen/segN+7;
      for(let s=0;s<segN;s++){
        const sx = dir>0 ? tipX + s*seg : tipX - s*seg;
        const yy = armY + Math.sin(s*0.9 + f.atkTimer*0.5)*5;
        px(dir>0?sx:sx-seg+3, yy, seg-3, 7, w2.color);
        px(dir>0?sx+seg-6:sx-seg+3, yy-4, 4, 4, '#2a5a1a'); // spike
      }
    } else if(st==='saber'){
      ctx.save();
      ctx.shadowColor = w2.glow||'#00e5ff'; ctx.shadowBlur = 16;
      px(tipX-6, armY-2, 12, 14, '#9aa');                 // hilt
      const bl = 48;
      ctx.fillStyle = w2.color; ctx.fillRect(Math.round(tipX-4), Math.round(armY-bl+2), 8, bl);
      ctx.fillStyle = w2.glow||'#fff'; ctx.fillRect(Math.round(tipX-1), Math.round(armY-bl+4), 3, bl-4);
      ctx.restore();
    }
  } else {
    // front arm resting
    px(cx + (f.dir>0? 20 : -32), armY, 12, 38, P.skin);
  }

  // flash overlay
  if(flashing){
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx-30, headY-4, 60, 150);
    ctx.globalAlpha = 1;
  }

  // armor-break: expanding white ring around the body
  if(f.armorBreakFx>0){
    ctx.save();
    ctx.globalAlpha = (f.armorBreakFx/20)*0.6;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    const rad = 34 + (20-f.armorBreakFx)*3.5;
    ctx.beginPath(); ctx.arc(cx, base-90, rad, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  ctx.restore();
}

const PAL_P = { skin:'#e8b58a', hair:'#3b2a1a', shirt:'#2f6bd6', pants:'#22314f', shoe:'#111', belt:'#12233f', emblem:'#ffd23f' };
const PAL_E = { skin:'#c98f6b', hair:'#111', shirt:'#c0392b', pants:'#3a1414', shoe:'#111', belt:'#2a0d0d', emblem:'#222' };

/* ---------- rounded-rect helpers (soften the blocky UI) ---------- */
function rrpath(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fillRR(x,y,w,h,r,col){ ctx.fillStyle=col; rrpath(x,y,w,h,r); ctx.fill(); }

/* ---------- scenery ---------- */
// smooth, softly-glowing sun (radial gradients — no hard pixels)
function drawSun(cx, cy, r){
  ctx.save();
  const glow = ctx.createRadialGradient(cx,cy,r*0.3, cx,cy,r*2.4);
  glow.addColorStop(0,'rgba(255,224,140,0.55)');
  glow.addColorStop(0.4,'rgba(255,214,107,0.18)');
  glow.addColorStop(1,'rgba(255,214,107,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(cx,cy,r*2.4,0,Math.PI*2); ctx.fill();
  const disc = ctx.createRadialGradient(cx-r*0.35,cy-r*0.35,r*0.2, cx,cy,r);
  disc.addColorStop(0,'#ffedb0'); disc.addColorStop(1,'#ffcf5f');
  ctx.fillStyle=disc; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawArena(){
  // sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#3a2b6b'); g.addColorStop(0.6,'#5a3a7a'); g.addColorStop(1,'#2a1b3a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // sun — smooth glowing disc
  drawSun(735, 92, 40);
  // distant blocky mountains
  ctx.fillStyle='#3d2f5e';
  for(let i=0;i<8;i++){ const bx=i*130-30; ctx.fillRect(bx,GROUND-120,110,120); ctx.fillRect(bx+20,GROUND-160,70,40); }
  // ground blocks (grass + dirt)
  for(let x=0;x<W;x+=40){
    ctx.fillStyle='#5a9a3a'; ctx.fillRect(x,GROUND,40,14);
    ctx.fillStyle='#4a7a2f'; ctx.fillRect(x,GROUND,40,4);
    ctx.fillStyle='#6b4a2a'; ctx.fillRect(x,GROUND+14,40,H-GROUND-14);
    ctx.fillStyle='#5a3d22'; ctx.fillRect(x+2,GROUND+20,10,10);
    ctx.fillStyle='#5a3d22'; ctx.fillRect(x+24,GROUND+34,8,8);
  }
}

function drawHealthBar(f, x, align){
  const bw = 340, bh = 26;
  fillRR(x-3,27,bw+6,bh+6, 8, '#000');
  fillRR(x,30,bw,bh, 6, '#3a1414');
  const pct = Math.max(0,f.hp)/(f.maxHp||MAX_HP);
  const col = pct>0.5 ? '#4ce04c' : pct>0.25 ? '#ffcf3f' : '#ff4c4c';
  const ww = bw*pct;
  ctx.save();
  rrpath(x,30,bw,bh,6); ctx.clip();               // keep the fill inside the rounded track
  ctx.fillStyle = col;
  if(align==='right') ctx.fillRect(x+bw-ww,30,ww,bh);
  else ctx.fillRect(x,30,ww,bh);
  // segment ticks
  ctx.fillStyle='rgba(0,0,0,.3)';
  for(let i=1;i<10;i++) ctx.fillRect(x+i*bw/10,30,2,bh);
  ctx.restore();
  // win pips
  ctx.fillStyle='#ffd23f';
  for(let i=0;i<f.wins;i++){
    const pxp = align==='right' ? x+bw-14-i*20 : x+4+i*20;
    ctx.fillRect(pxp,62,14,14);
  }
}

/* ---------- armor icon + HUD ---------- */
// lighten (amt>0) / darken (amt<0) a #rrggbb colour
function shade(hex, amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(amt<0){ const f=1+amt; r*=f; g*=f; b*=f; }
  else { r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function shieldPath(px,py,pw,ph){
  const c=px+pw/2;
  ctx.beginPath();
  ctx.moveTo(px, py+ph*0.16); ctx.lineTo(px, py+ph*0.55);
  ctx.quadraticCurveTo(px, py+ph*0.92, c, py+ph);
  ctx.quadraticCurveTo(px+pw, py+ph*0.92, px+pw, py+ph*0.55);
  ctx.lineTo(px+pw, py+ph*0.16);
  ctx.quadraticCurveTo(px+pw, py, c, py);
  ctx.quadraticCurveTo(px, py, px, py+ph*0.16);
  ctx.closePath();
}
// a shield with a material-specific texture; opts.broken = cracked/greyed
function drawArmorIcon(x, y, s, armor, opts){
  opts = opts||{};
  const broken = opts.broken;
  const body = broken ? '#3a3550' : armor.body;
  const trim = broken ? '#2a2540' : armor.trim;
  const w=s, h=s*1.15, cx=x+w/2;
  ctx.save();
  shieldPath(x,y,w,h); ctx.fillStyle=body; ctx.fill();

  if(!broken){
    ctx.save(); shieldPath(x,y,w,h); ctx.clip();     // keep texture inside the shield
    const dk=shade(body,-0.28), lt=shade(body,0.30);
    switch(armor.style){
      case 'wood': {                                  // vertical planks + grain
        ctx.strokeStyle=dk; ctx.lineWidth=Math.max(1,s*0.05);
        for(let i=1;i<3;i++){ const px=x+w*i/3; ctx.beginPath(); ctx.moveTo(px,y-2); ctx.lineTo(px,y+h+2); ctx.stroke(); }
        ctx.strokeStyle=lt; ctx.lineWidth=Math.max(1,s*0.03);
        ctx.beginPath(); ctx.moveTo(x+w*0.17,y+h*0.28); ctx.lineTo(x+w*0.17,y+h*0.66);
                         ctx.moveTo(x+w*0.83,y+h*0.30); ctx.lineTo(x+w*0.83,y+h*0.62); ctx.stroke();
        break;
      }
      case 'leather': {                               // dashed stitching inset
        ctx.strokeStyle=lt; ctx.lineWidth=Math.max(1,s*0.045);
        ctx.setLineDash([Math.max(2,s*0.13), Math.max(1.5,s*0.09)]);
        const in1=s*0.16; shieldPath(x+in1, y+in1, w-2*in1, h-2*in1); ctx.stroke();
        ctx.setLineDash([]);
        break;
      }
      case 'chain': {                                 // grid of interlocking rings
        ctx.strokeStyle=dk; ctx.lineWidth=Math.max(1,s*0.05);
        const r=s*0.13, step=r*1.7;
        for(let row=0, yy=y+step*0.9; yy<y+h; yy+=step, row++){
          for(let xx=x+step*(row%2?0.9:0.4); xx<x+w; xx+=step){
            ctx.beginPath(); ctx.arc(xx, yy, r, 0, Math.PI*2); ctx.stroke();
          }
        }
        break;
      }
      case 'gold': {                                  // shine streak + center gem
        ctx.fillStyle='rgba(255,255,255,0.28)';
        ctx.beginPath(); ctx.moveTo(x+w*0.18,y); ctx.lineTo(x+w*0.44,y); ctx.lineTo(x+w*0.16,y+h*0.55); ctx.closePath(); ctx.fill();
        const gx=cx, gy=y+h*0.44, gr=s*0.17;          // ruby gem
        ctx.fillStyle='#e63a5e';
        ctx.beginPath(); ctx.moveTo(gx,gy-gr); ctx.lineTo(gx+gr,gy); ctx.lineTo(gx,gy+gr); ctx.lineTo(gx-gr,gy); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(gx-gr*0.3, gy-gr*0.3, gr*0.22, 0, Math.PI*2); ctx.fill();
        break;
      }
      case 'iron': {                                  // center seam + corner rivets
        ctx.strokeStyle=dk; ctx.lineWidth=Math.max(1,s*0.055);
        ctx.beginPath(); ctx.moveTo(cx,y+h*0.08); ctx.lineTo(cx,y+h*0.86); ctx.stroke();
        ctx.fillStyle=lt; const rv=Math.max(1.4,s*0.07);
        [[0.26,0.24],[0.74,0.24],[0.29,0.6],[0.71,0.6]].forEach(([fx,fy])=>{
          ctx.beginPath(); ctx.arc(x+w*fx, y+h*fy, rv, 0, Math.PI*2); ctx.fill();
        });
        break;
      }
    }
    ctx.restore();
  }

  shieldPath(x,y,w,h); ctx.lineWidth=Math.max(2,s*0.09); ctx.strokeStyle=trim; ctx.stroke();
  if(broken){
    ctx.strokeStyle='#12101f'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(x+w*0.32,y+h*0.18); ctx.lineTo(x+w*0.58,y+h*0.52); ctx.lineTo(x+w*0.4,y+h*0.82); ctx.stroke();
  }
  // rank number badge in the centre (1 = weakest ... 5 = strongest)
  const num = ARMORS.indexOf(armor)+1, nyc = y+h*0.46;
  ctx.beginPath(); ctx.arc(cx, nyc, s*0.3, 0, Math.PI*2);
  ctx.fillStyle='rgba(15,12,26,0.55)'; ctx.fill();
  ctx.font='bold '+Math.round(s*0.46)+'px "Courier New",monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = broken ? '#9a90b0' : '#fff8e0';
  ctx.fillText(num, cx, nyc+s*0.02);
  ctx.restore();
}
// row of armor layers under the player's health bar
function drawArmorHUD(f){
  const st=f.armorStack; if(!st||!st.length) return;
  const s=20, gap=22, y=128, x0=30;
  pixelText('ARMOR', x0+16, y-10, 10, '#9a8fc0', null);
  for(let i=0;i<st.length;i++){

    if(active){ ctx.save(); ctx.shadowColor='#ffd23f'; ctx.shadowBlur=12; drawArmorIcon(x,y,s,layer.def,{broken}); ctx.restore(); }
    else drawArmorIcon(x,y,s,layer.def,{broken});
    const by=y+s*1.15+4, bw=s;
    fillRR(x,by,bw,3,1,'#000');

  }
}

/* ---------- particles ---------- */
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.5; p.life-=0.04;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    const s = 3+p.life*4;
    ctx.fillRect(p.x, p.y, s, s);
  }
  ctx.globalAlpha = 1;
}

/* ---------- projectiles (guns, kunai, grenades) ---------- */
function spawnProjectile(f){
  const w = f.weapon;
  projectiles.push({
    x: f.x + f.dir*30, y: f.y-92, dir: f.dir,
    vx: f.dir*(w.kind==='throw'?7:11), vy: w.kind==='throw'?-8:0,
    dmg: w.dmg*(f.dmgMult||1)*(f.enchant||1), kb: w.kb, type: w.dmgType,
    color: w.proj||w.color||'#fff', glow: w.glow, kind: w.kind, style: w.style,
    owner: f, life: w.kind==='throw'?140:80
  });
  SFX.swing();
}
function damageFrom(foe, dmg, kb, dir, blockable, type){
  if(blockable && foe.blocking && foe.onGround){
    // fully blocked — no damage from a blockable shot
    foe.vx = dir*4; foe.flash = 4; shake = Math.max(shake,4);
    spawnParticles(foe.x - dir*18, foe.y-90, '#8fd0ff', 8); SFX.block(); return;
  }
  let d = dmg;   // grenade blasts (non-blockable) hit full even through a block
  if(foe.isPlayer) d = applyArmor(foe, d, type||'blade');   // armor soaks player hits
  foe.hp -= d; if(foe.hp<0) foe.hp=0;
  foe.hitstun = 15; foe.flash = 6;
  foe.vx = dir*kb*1.7; foe.vy = -4; foe.x += dir*10;   // strong, instant recoil
  shake = Math.max(shake, 6+kb*0.3);
  spawnParticles(foe.x, foe.y-90, '#3aa8ff', 12);   // water splash
  spawnParticles(foe.x, foe.y-90, '#bfe9ff', 5);    // light spray
  SFX.hit();
}
function explode(p){
  spawnParticles(p.x, p.y, p.color, 20);
  spawnParticles(p.x, p.y, '#ffd23f', 12);
  shake = Math.max(shake, 13);
  SFX.hit();
  for(const f of [player, enemy]){
    if(!f || f===p.owner || f.hitstun>0) continue;
    const b = bodyBox(f), cx = b.x+b.w/2, cy = b.y+b.h/2;
    if(Math.hypot(cx-p.x, cy-p.y) < 85){
      damageFrom(f, p.dmg, p.kb, cx<p.x?-1:1, false, 'explosive');
    }
  }
}
function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    p.x += p.vx;
    if(p.kind==='throw'){
      p.vy += 0.5; p.y += p.vy;
      if(p.y >= GROUND-8){ explode(p); projectiles.splice(i,1); continue; }
    }
    p.life--;
    const foe = (p.owner===player) ? enemy : player;
    if(foe && foe.hitstun<=0){
      const b = bodyBox(foe);
      if(p.x>b.x-4 && p.x<b.x+b.w+4 && p.y>b.y-4 && p.y<b.y+b.h+4){
        if(p.kind==='throw') explode(p);
        else damageFrom(foe, p.dmg, p.kb, p.dir, true, p.type);
        projectiles.splice(i,1); continue;
      }
    }
    if(p.life<=0 || p.x<-30 || p.x>W+30){
      if(p.kind==='throw') explode(p);
      projectiles.splice(i,1);
    }
  }
}
function drawProjectiles(){
  for(const p of projectiles){
    ctx.save();
    if(p.glow){ ctx.shadowColor=p.glow; ctx.shadowBlur=14; }
    ctx.fillStyle = p.color;
    if(p.kind==='throw'){
      ctx.fillRect(p.x-6,p.y-6,12,12);
      ctx.fillStyle='#111'; ctx.fillRect(p.x-2,p.y-10,4,5);      // fuse
    } else if(p.style==='gun'){
      ctx.fillRect(p.x-9,p.y-4,18,8);                            // energy bolt
      ctx.fillStyle='#fff'; ctx.fillRect(p.x-3,p.y-2,6,4);
    } else {                                                     // kunai
      ctx.fillRect(p.x-9,p.y-3,18,6);
      ctx.fillStyle='#6b4a2a'; ctx.fillRect(p.x - p.dir*13, p.y-2, 6,4);
    }
    ctx.restore();
  }
}

/* ---------- HOME / MENU ---------- */
function animateDemo(d, homeX, dir, phase){
  d.dir = dir;
  d.bob += 0.05;
  d.walk += 0.16;
  // gravity so jumps look real
  d.vy += 0.9; d.y += d.vy;
  if(d.y>=GROUND){ d.y=GROUND; d.vy=0; d.onGround=true; } else d.onGround=false;
  // gentle stepping sway around the home spot
  d.x = homeX + Math.sin((demoTimer+phase)*0.03)*16;
  // attack lifecycle
  if(d.attacking){ d.atkTimer--; if(d.atkTimer<=0){ d.attacking=false; d.atkCd=12; } }
  if(d.atkCd>0) d.atkCd--;
  // scripted moves: jab, jump, and the occasional guard
  const c = demoTimer + phase;
  if(c%78===0 && !d.attacking && d.atkCd<=0){ d.attacking=true; d.atkTimer=d.weapon.cd; }
  if(c%190===0 && d.onGround){ d.vy=-13; }          // little hop
  d.blocking = (c%260) < 34 && d.onGround;          // brief guard now and then
}
function updateHome(){
  demoTimer++;
  // preview the exact weapons you'll fight with
  demoA.weapon = WEAPONS[playerWeapon];
  demoB.weapon = (difficulty===0) ? WEAPONS[playerWeapon]
                                  : WEAPONS[(playerWeapon+1)%4];  // CPU uses a base weapon
  animateDemo(demoA, 150, 1, 0);

  // menu navigation
  if(pressed['ArrowUp']){ menuIndex=(menuIndex+MENU.length-1)%MENU.length; SFX.select(); }
  if(pressed['ArrowDown']){ menuIndex=(menuIndex+1)%MENU.length; SFX.select(); }
  if(pressed['Enter']||pressed['Space']) chooseMenu(menuIndex);

  // mouse hover / click
  const items = menuRects();
  items.forEach((r,i)=>{
    if(mouse.x>r.x && mouse.x<r.x+r.w && mouse.y>r.y && mouse.y<r.y+r.h){
      menuIndex = i;
      if(mouse.click) chooseMenu(i);
    }
  });
}
function menuRects(){
  const items=[]; const startY=190, sp=32, h=25;   // sp-h = gap between items
  for(let i=0;i<MENU.length;i++) items.push({x:W/2-140,y:startY+i*sp,w:280,h:h});

}
function chooseMenu(i){

function stat(label,val,x,y,w,color){

function wrapText(t,cx,cy,maxw,lh){
  const words=t.split(' '); let line=''; let y=cy;

    else line+=wd+' ';
  }
  ctx.fillText(line,cx,y);
}

  if(potions[key]<=0){ SFX.block(); potionMsg='YOU HAVE NO '+p.name+'S'; return; }

    potionMsg=w.name+' ENCHANTED TO +'+weaponLevels[w.name]+'  (+'+Math.round(ENCH_STEP*weaponLevels[w.name]*100)+'% DMG)';
  } else {
    if(bonusHP >= HP_CAP){ SFX.block(); potionMsg='MAX HEALTH ALREADY MAXED ('+(HP_BASE+HP_CAP)+')'; return; }
    bonusHP = Math.min(HP_CAP, bonusHP+HP_STEP);
    potions.health--; saveState(); SFX.win();
    potionMsg='MAX HEALTH RAISED TO '+playerMaxHP();
  }
}

  if(homeButtonClicked()){ scene='home'; menuIndex=0; return; }
  if(pressed['ArrowLeft']){ potionIndex=(potionIndex+POTIONS.length-1)%POTIONS.length; potionMsg=''; SFX.select(); }
  if(pressed['ArrowRight']){ potionIndex=(potionIndex+1)%POTIONS.length; potionMsg=''; SFX.select(); }
  if(pressed['Enter']||pressed['Space']){ usePotion(POTIONS[potionIndex].key); }
  if(pressed['Backspace']){ scene='home'; menuIndex=0; }
  potionRects().forEach((r,i)=>{
    if(mouse.x>r.x&&mouse.x<r.x+r.w&&mouse.y>r.y&&mouse.y<r.y+r.h){
      if(i!==potionIndex){ potionIndex=i; potionMsg=''; }
      if(mouse.click) usePotion(POTIONS[i].key);
    }
  });
}
function drawPotions(){
  drawArena();
  ctx.fillStyle='rgba(13,11,20,.8)'; ctx.fillRect(0,0,W,H);
  pixelText('POTIONS', W/2, 62, 40, '#ffd23f', '#ff8a00');
  pixelText('EARN THEM BY WINNING MATCHES', W/2, 100, 15, '#c9b8ff', null);
  drawHomeButton();

  potionRects().forEach((r,i)=>{
    const p = POTIONS[i], on = potionsUnlocked.has(p.key), sel = i===potionIndex;
    fillRR(r.x-4,r.y-4,r.w+8,r.h+8, 14, sel ? p.glow : '#2a2140');
    fillRR(r.x,r.y,r.w,r.h, 10, '#141024');
    const cx = r.x+r.w/2;
    drawPotionBottle(cx, r.y+90, p.icon, p.glow, !on);
    if(on){
      pixelText(p.name, cx, r.y+146, 18, sel?p.glow:'#fff', null);
      ctx.save(); ctx.font='12px "Courier New",monospace'; ctx.fillStyle='#b8a8e0'; ctx.textAlign='center';
      wrapText(p.desc, cx, r.y+172, r.w-34, 15);
      ctx.restore();
      pixelText('OWNED: '+potions[p.key], cx, r.y+r.h-42, 16, potions[p.key]>0?'#7fe07f':'#6a5f8a', null);
      const status = p.key==='enchant'
        ? WEAPONS[playerWeapon].name+'  +'+enchantLevel(WEAPONS[playerWeapon])+' / +'+ENCH_CAP
        : 'MAX HP  '+playerMaxHP()+' / '+(HP_BASE+HP_CAP);
      pixelText(status, cx, r.y+r.h-18, 13, '#ffd23f', null);
    } else {
      const lx=cx, ly=r.y+150;
      ctx.fillStyle=sel?'#ffd23f':'#6a5f8a';
      ctx.fillRect(lx-8,ly-16,16,5); ctx.fillRect(lx-10,ly-14,4,12); ctx.fillRect(lx+6,ly-14,4,12);
      ctx.fillRect(lx-16, ly-2, 32, 26);
      ctx.fillStyle='#0f0c1a'; ctx.fillRect(lx-3, ly+6, 6, 10);
      pixelText('LOCKED', cx, r.y+r.h-42, 16, sel?'#ffd23f':'#6a5f8a', null);
      pixelText('WIN A MATCH TO EARN', cx, r.y+r.h-18, 12, '#8a7fb0', null);
    }
  });

  if(potionMsg) pixelText(potionMsg, W/2, H-40, 15, '#7fe07f', null);
}

/* ---------- ARMOR SCREEN (collection / reference) ---------- */
function armorRects(){
  const n=ARMORS.length, cw=160, gap=12;
  const total=n*cw+(n-1)*gap, sx=Math.round((W-total)/2);
  const cards=[];
  for(let i=0;i<n;i++) cards.push({x:sx+i*(cw+gap), y:138, w:cw, h:250});
  return cards;
}
function updateArmor(){
  if(homeButtonClicked()){ scene='home'; menuIndex=0; return; }
  if(pressed['ArrowRight']){ armorIndex=Math.min(ARMORS.length-1, armorIndex+1); SFX.select(); }
  if(pressed['ArrowLeft']){  armorIndex=Math.max(0, armorIndex-1); SFX.select(); }
  if(pressed['Backspace']){ scene='home'; menuIndex=0; }
  armorRects().forEach((r,i)=>{
    if(mouse.x>r.x&&mouse.x<r.x+r.w&&mouse.y>r.y&&mouse.y<r.y+r.h) armorIndex=i;
  });
}
function drawArmor(){
  drawArena();
  ctx.fillStyle='rgba(13,11,20,.8)'; ctx.fillRect(0,0,W,H);
  pixelText('ARMOR', W/2, 60, 40, '#ffd23f', '#ff8a00');
  pixelText('EARNED BY WINNING MATCHES — WEAKEST FIRST', W/2, 98, 15, '#c9b8ff', null);
  pixelText('OWNED '+armorsUnlocked.size+'/'+ARMORS.length, W-90, 40, 14, '#7fe07f', null);
  drawHomeButton();

  armorRects().forEach((r,i)=>{
    const a=ARMORS[i], on=armorsUnlocked.has(a.key), sel=i===armorIndex;
    fillRR(r.x-4,r.y-4,r.w+8,r.h+8, 12, sel ? a.body : '#2a2140');
    fillRR(r.x,r.y,r.w,r.h, 9, '#141024');
    const cx=r.x+r.w/2;
    drawArmorIcon(cx-27, r.y+26, 54, a, {broken:!on});
    if(on){
      pixelText(a.name, cx, r.y+128, 17, sel? a.body : '#fff', null);
      pixelText('DURABILITY '+a.dura, cx, r.y+152, 12, '#9a8fc0', null);
      const bw=armorBestWorst(a);
      pixelText('RESISTS '+bw.best.toUpperCase(), cx, r.y+182, 12, '#7fe07f', null);
      pixelText('WEAK TO '+bw.worst.toUpperCase(), cx, r.y+204, 12, '#ff8a5a', null);
    } else {
      const lx=cx, ly=r.y+132;
      ctx.fillStyle=sel?'#ffd23f':'#6a5f8a';
      ctx.fillRect(lx-8,ly-16,16,5); ctx.fillRect(lx-10,ly-14,4,12); ctx.fillRect(lx+6,ly-14,4,12);
      ctx.fillRect(lx-16, ly-2, 32, 26);
      ctx.fillStyle='#0f0c1a'; ctx.fillRect(lx-3, ly+6, 6, 10);
      pixelText('LOCKED', cx, r.y+180, 14, sel?'#ffd23f':'#6a5f8a', null);
      pixelText('WIN A MATCH', cx, r.y+202, 11, '#8a7fb0', null);
    }
  });

  pixelText('Owned armors LAYER UP automatically in battle — weakest first, then stronger as each breaks.',
            W/2, H-28, 14, '#c9b8ff', null);
}

/* ---------- HELP SCREEN (scrollable) ---------- */
const HELP_LINES = [
  ['CONTROLS', '#ffd23f'],
  ['←  →      Move left / right', '#fff'],
  ['↑        Jump', '#fff'],
  ['↓        Block (hold to fully guard)', '#fff'],
  ['SPACE    Attack with your weapon', '#fff'],
  ['C        Swap to a random weapon', '#fff'],
  ['ESC      Return to the menu', '#fff'],
  ['', '#fff'],
  ['HOW TO PLAY', '#ffd23f'],
  ['Best of 3 — win 2 rounds to take the match.', '#c9b8ff'],
  ['Drain the CPU’s health bar to win a round.', '#c9b8ff'],
  ['Face the CPU and time your strikes.', '#c9b8ff'],
  ['Back off to recover when you’re hurt.', '#c9b8ff'],
  ['', '#fff'],
  ['BLOCKING', '#ffd23f'],
  ['Hold ↓ to guard. A guarded hit deals NO', '#c9b8ff'],
  ['damage — but you can’t move while blocking.', '#c9b8ff'],
  ['Grenade blasts punch through blocks!', '#c9b8ff'],
  ['', '#fff'],
  ['WEAPONS', '#ffd23f'],
  ['MELEE: fists, sword, hammer, sabers, whip.', '#7fe07f'],
  ['RANGED: kunai & element gun fire shots.', '#7fe07f'],
  ['THROWN: grenade lobs a big blast.', '#7fe07f'],
  ['Each has its own reach, speed & power.', '#7fe07f'],
  ['', '#fff'],
  ['ARMOR', '#ffd23f'],
  ['WIN MATCHES to earn armor: wood → leather', '#7fe07f'],
  ['→ chain → gold → iron (weakest first).', '#7fe07f'],
  ['Owned armors LAYER UP in battle — the weakest', '#c9b8ff'],
  ['is worn first; when it breaks the next takes over.', '#c9b8ff'],
  ['Each armor resists weapon types differently:', '#c9b8ff'],
  ['e.g. chain shrugs off blades but hammers smash it;', '#c9b8ff'],
  ['energy melts wood but gold resists it.', '#c9b8ff'],
  ['', '#fff'],
  ['UNLOCKS & POTIONS', '#ffd23f'],
  ['WIN ROUNDS to UNLOCK new weapons.', '#7fe07f'],
  ['WIN MATCHES to earn a random POTION:', '#7fe07f'],
  ['• ENCHANT: +12% weapon damage (max +3).', '#b8a8e0'],
  ['• HEALTH: +15 max HP (max +60).', '#b8a8e0'],
  ['Spend potions on the POTIONS screen.', '#7fe07f'],
  ['DIFFICULTY sets how tough the CPU fights.', '#7fe07f'],
  ['Progress is SAVED in this browser.', '#7fe07f']
];
function helpContentHeight(){
  let h=0;
  for(const [txt,col] of HELP_LINES) h += txt==='' ? 12 : (col==='#ffd23f'?26:22);
  return h;
}
function helpViewport(){ const top=100, bottom=H-40; return { top, bottom, vh:(bottom-top-16) }; }
function helpMaxScroll(){ return Math.max(0, helpContentHeight() - helpViewport().vh); }
function updateHelp(){
  if(homeButtonClicked()){ scene='home'; menuIndex=0; return; }
  if(keys['ArrowDown']) helpScroll += 8;
  if(keys['ArrowUp'])   helpScroll -= 8;
  if(wheel)             helpScroll += wheel;
  helpScroll = Math.max(0, Math.min(helpMaxScroll(), helpScroll));
}
function drawHelp(){
  drawArena();
  ctx.fillStyle='rgba(13,11,20,.82)'; ctx.fillRect(0,0,W,H);
  pixelText('HOW TO PLAY', W/2, 64, 40, '#ffd23f', '#ff8a00');
  drawHomeButton();
  const vp = helpViewport();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, vp.top, W, vp.bottom-vp.top); ctx.clip();
  ctx.textAlign='left';
  let y = vp.top+16 - helpScroll; const x = W/2-260;
  for(const [txt,col] of HELP_LINES){
    if(txt===''){ y+=12; continue; }
    const header = col==='#ffd23f';
    ctx.font = (header?'bold 19px':'16px')+' "Courier New",monospace';
    ctx.fillStyle = col;
    if(header){ ctx.shadowColor='#ff8a00'; ctx.shadowBlur=10; } else { ctx.shadowBlur=0; }
    ctx.fillText(txt, x, y);
    y += header ? 26 : 22;
  }
  ctx.restore();
  // scrollbar
  const maxS = helpMaxScroll();
  if(maxS>0){
    const trackX=W-44, trackY=vp.top+6, trackH=vp.bottom-vp.top-12;
    ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(trackX,trackY,6,trackH);
    const thumbH=Math.max(24, trackH*vp.vh/helpContentHeight());
    const thumbY=trackY + (trackH-thumbH)*(helpScroll/maxS);
    ctx.fillStyle='#7a6fa0'; ctx.fillRect(trackX,thumbY,6,thumbH);
  }
}

/* ---------- FIGHT ---------- */
function updateFight(){
  if(homeButtonClicked(fightHomeBtnRect())){ scene='home'; menuIndex=0; return; }  // quit to menu
  if(roundBanner>0){ roundBanner--; if(roundBanner>60){ return; } }
  controlPlayer(player);
  controlAI(enemy, player);
  updateFighter(player, enemy);
  updateFighter(enemy, player);
  updateProjectiles();
  updateParticles();
  if(shake>0) shake*=0.85;

  // round end
  if((player.hp<=0 || enemy.hp<=0) && scene==='fight'){
    unlockNotice = null;
    if(enemy.hp<=0){ player.wins++; unlockNotice = unlockNext(); } // win a round -> earn a weapon
    else if(player.hp<=0){ enemy.wins++; }
    if(player.wins>=2 || enemy.wins>=2){
      matchResult = player.wins>=2 ? 'YOU WIN!' : 'YOU LOSE';
      potionNotice = player.wins>=2 ? awardPotion() : null;  // win the match -> earn a potion
      armorNotice  = player.wins>=2 ? awardArmor()  : null;  // ...and the next armor
      if(player.wins>=2) SFX.win(); else SFX.lose();
      scene='matchover';
      roundBanner=0;
    } else {
      round++;
      scene='roundover';
      bannerText = enemy.hp<=0 ? 'ROUND WON!' : 'ROUND LOST';
      countdownStart = performance.now();   // real-time 4-second countdown
      lastCount = 5;
      SFX[enemy.hp<=0?'win':'lose']();
    }
  }
}
function drawFight(){
  ctx.save();
  if(shake>0.5){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }
  drawArena();
  drawFighter(enemy, PAL_E, 0);
  drawFighter(player, PAL_P, 0);
  drawProjectiles();
  drawParticles();
  ctx.restore();

  // HUD
  drawHealthBar(player, 30, 'left');
  drawHealthBar(enemy, W-370, 'right');
  pixelText('YOU', 200, 98, 16, '#8fbfff', null);
  pixelText('CPU', W-200, 98, 16, '#ff9a9a', null);
  pixelText('ROUND '+round, W/2, 44, 22, '#ffd23f', null);
  pixelText('LEVEL: '+DIFFICULTIES[difficulty].name, W/2, 72, 14, DIFFICULTIES[difficulty].color, null);
  pixelText(player.weapon.name, 200, 120, 13, '#7fe07f', null);
  pixelText(enemy.weapon.name, W-200, 120, 13, '#ff7f7f', null);
  drawArmorHUD(player);

  if(roundBanner>0){
    ctx.fillStyle='rgba(0,0,0,'+Math.min(0.5,roundBanner/200)+')'; ctx.fillRect(0,0,W,H);
    const scale = roundBanner>60 ? 1+(roundBanner-60)/80 : 1;
    pixelText(bannerText, W/2, H/2, 54*scale, '#ffd23f', '#ff8a00');
  }
  // in-fight quit button (only during actual play, not the round-over backdrop)
  if(scene==='fight') drawHomeButton(fightHomeBtnRect());
}

/* ---------- ROUND / MATCH OVER ---------- */
function updateRoundover(){
  updateParticles();
  const elapsed = (performance.now()-countdownStart)/1000;   // seconds
  const count = Math.ceil(4-elapsed);                        // 4,3,2,1
  if(count!==lastCount && count>=1){ lastCount=count; SFX.select(); }  // one beep per second
  if(elapsed>=4){ nextRound(); }
}
function drawRoundover(){
  drawFight();
  ctx.fillStyle='rgba(13,11,20,.55)'; ctx.fillRect(0,0,W,H);
  const won = bannerText==='ROUND WON!';
  pixelText(bannerText, W/2, H/2-70, 52, won?'#7fe07f':'#ff6b6b', won?'#2f6':'#f33');
  const elapsed = (performance.now()-countdownStart)/1000;
  const count = Math.max(1, Math.ceil(4-elapsed));
  const frac = elapsed - Math.floor(elapsed);        // 0..1 within the current second
  const pop = 1 + Math.max(0, 0.16-frac)*2.2;        // quick pop as each number appears
  pixelText(count, W/2, H/2+6, 84*pop, '#ffd23f', '#ff8a00');
  if(unlockNotice){
    pixelText('★ NEW WEAPON UNLOCKED ★', W/2, H/2+74, 18, '#ffd23f', '#ff8a00');
    pixelText(unlockNotice, W/2, H/2+104, 24, '#7fe07f', '#2f6');
  } else {
    pixelText('GET READY', W/2, H/2+88, 20, '#c9b8ff', null);
  }
}

// OKAY button sits just below however many reward notices are shown
function matchNoticeCount(){ return (unlockNotice?1:0)+(potionNotice?1:0)+(armorNotice?1:0); }
function okayBtnRect(){
  const ny = (H/2+84) + matchNoticeCount()*28;
  const w=180, h=50;
  return { x:Math.round(W/2-w/2), y:Math.round(ny+6), w, h };
}
function updateMatchover(){
  updateParticles();
  // dismiss only via the OKAY button (Enter confirms it); no space-bar / click-anywhere
  if(pressed['Enter'] || (mouse.click && inRect(okayBtnRect()))){ SFX.select(); scene='home'; menuIndex=0; }
}
function drawMatchover(){
  drawArena();
  drawFighter(enemy, PAL_E, 0);
  drawFighter(player, PAL_P, 0);
  ctx.fillStyle='rgba(13,11,20,.7)'; ctx.fillRect(0,0,W,H);
  const win = matchResult==='YOU WIN!';
  pixelText(matchResult, W/2, H/2-40, 90, win?'#ffd23f':'#ff5a5a', win?'#ff8a00':'#900');
  pixelText('SCORE  YOU '+player.wins+'  —  '+enemy.wins+' CPU', W/2, H/2+40, 26, '#fff', null);
  let ny = H/2+84;
  if(unlockNotice){ pixelText('★ NEW WEAPON UNLOCKED: '+unlockNotice, W/2, ny, 18, '#ffd23f', '#ff8a00'); ny += 28; }
  if(potionNotice){ pixelText('★ POTION EARNED: '+potionNotice.name, W/2, ny, 18, potionNotice.glow, potionNotice.icon); ny += 28; }
  if(armorNotice){ pixelText('★ ARMOR EARNED: '+armorNotice.name, W/2, ny, 18, armorNotice.body, armorNotice.trim); ny += 28; }
  // OKAY button
  const r = okayBtnRect(), hot = inRect(r);
  fillRR(r.x-4,r.y-4,r.w+8,r.h+8, 14, hot?'#ffd23f':'#2a2140');
  fillRR(r.x,r.y,r.w,r.h, 10, '#141024');
  pixelText('OKAY', r.x+r.w/2, r.y+r.h/2, 24, hot?'#ffd23f':'#c9b8ff', hot?'#ff8a00':null);
}

/* ---------- RESET CONFIRM ---------- */
function resetRects(){
  const w=190, h=56, gap=44, y=Math.round(H/2)+44;
  const total=2*w+gap, sx=Math.round((W-total)/2);
  return [ {x:sx, y, w, h}, {x:sx+w+gap, y, w, h} ];   // [NO, YES]
}
function doReset(confirm){
  if(confirm){ resetGame(); SFX.win(); } else SFX.select();
  scene='home'; menuIndex=0;
}
function updateReset(){
  if(pressed['ArrowLeft']||pressed['ArrowRight']){ resetSel^=1; SFX.select(); }
  if(pressed['KeyY']) return doReset(true);
  if(pressed['KeyN']) return doReset(false);
  if(pressed['Enter']||pressed['Space']) return doReset(resetSel===1);
  const rects = resetRects();
  rects.forEach((r,i)=>{
    if(mouse.x>r.x&&mouse.x<r.x+r.w&&mouse.y>r.y&&mouse.y<r.y+r.h){
      resetSel=i;
      if(mouse.click) doReset(i===1);
    }
  });
}
function drawConfirmBtn(r, label, sel, col){
  fillRR(r.x-4,r.y-4,r.w+8,r.h+8, 14, sel ? col : '#2a2140');
  fillRR(r.x,r.y,r.w,r.h, 10, '#141024');
  pixelText(label, r.x+r.w/2, r.y+r.h/2, 20, sel?col:'#9a8fc0', sel?col:null);
}
function drawReset(){
  drawHome();                                  // menu as a dimmed backdrop
  ctx.fillStyle='rgba(13,11,20,.86)'; ctx.fillRect(0,0,W,H);
  pixelText('ARE YOU SURE?', W/2, H/2-96, 46, '#ff5a5a', '#900');
  pixelText('This will RESET ALL the data —', W/2, H/2-38, 17, '#c9b8ff', null);
  pixelText('unlocked weapons, potions, enchants & progress.', W/2, H/2-14, 17, '#c9b8ff', null);
  pixelText('This cannot be undone.', W/2, H/2+10, 15, '#8a7fb0', null);
  const [no,yes]=resetRects();
  drawConfirmBtn(no,  'NO, KEEP',  resetSel===0, '#7fe07f');
  drawConfirmBtn(yes, 'YES, WIPE', resetSel===1, '#ff5a5a');
}

/* ---------- QUIT ---------- */
function drawQuit(){
  ctx.fillStyle='#0d0b14'; ctx.fillRect(0,0,W,H);
  pixelText('THANKS FOR PLAYING', W/2, H/2-30, 44, '#ffd23f', '#ff8a00');
  pixelText('XWAR', W/2, H/2+30, 60, '#fff', null);
  pixelText('press SPACE to return', W/2, H/2+100, 18, '#7a6fa0', null);
  if(pressed['Space']||pressed['Enter']||mouse.click){ scene='home'; menuIndex=0; }
}

/* ---------- main loop ---------- */
function loop(){
  // Escape always returns to the home menu
  if(pressed['Escape'] && scene!=='home'){ scene='home'; menuIndex=0; SFX.select(); }
  switch(scene){
    case 'home': updateHome(); drawHome(); break;
    case 'weapons': updateWeapons(); drawWeapons(); break;
    case 'armor': updateArmor(); drawArmor(); break;
    case 'potions': updatePotions(); drawPotions(); break;
    case 'difficulty': updateDifficulty(); drawDifficulty(); break;
    case 'help': updateHelp(); drawHelp(); break;
    case 'fight': updateFight(); drawFight(); break;
    case 'roundover': updateRoundover(); drawRoundover(); break;
    case 'matchover': updateMatchover(); drawMatchover(); break;
    case 'reset': updateReset(); drawReset(); break;
    case 'quit': drawQuit(); break;
  }
  // clear one-frame input
  for(const k in pressed) pressed[k]=false;
  mouse.click = false;
  wheel = 0;
  requestAnimationFrame(loop);
}
loop();

})();
</script>
